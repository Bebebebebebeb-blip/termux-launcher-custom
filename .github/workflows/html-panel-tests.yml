name: HTML panel focused tests

on:
  push:
    branches:
      - feat/native-panels
  workflow_dispatch:

concurrency:
  group: ${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  page-kind-tests:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v6

      - name: Setup Java 21
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: "21"

      - name: Setup Gradle cache
        uses: gradle/actions/setup-gradle@v4

      - name: Run focused PageKind test
        shell: bash
        env:
          GRADLE_OPTS: >-
            -Dorg.gradle.internal.http.connectionTimeout=120000
            -Dorg.gradle.internal.http.socketTimeout=120000
          GRADLE_MAX_ATTEMPTS: "5"
          GRADLE_RETRY_SLEEP_SECONDS: "20"
          GRADLE_REFRESH_FROM_ATTEMPT: "2"
        run: |
          ./.github/scripts/gradle_retry.sh ./gradlew --no-daemon :app:testDebugUnitTest --tests com.termux.app.page.PageKindTest
